name: Update Data Files

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch NBA data
        run: curl -sSL "https://raw.githubusercontent.com/sspam1189-stack/PythonNBA/main/data/history.json" -o data/nba.json

      - name: Fetch Full Season data
        run: curl -sSL "https://raw.githubusercontent.com/sspam1189-stack/PythonFull/main/data/history.json" -o data/fullseason.json

      - name: Fetch NCAA data
        run: curl -sSL "https://raw.githubusercontent.com/sspam1189-stack/PythonNCAA/main/data/history.json" -o data/ncaa.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || (git commit -m "Update data files [skip ci]" && git push)
