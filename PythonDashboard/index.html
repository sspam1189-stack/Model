<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Python Bayesian + LR Confirmation spread and totals picks dashboard for NBA and NCAA">
  <title>Python Picks Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=5">
</head>
<body>
  <header class="header">
    <h1>Python Picks Dashboard</h1>
    <p class="subtitle">Bayesian + LR Confirmation spread picks &middot; Units at -110</p>
    <div id="last-run-info" class="subtitle" style="margin-top:4px;font-size:0.75rem;color:var(--muted)"></div>
    <div id="last-sync-info" class="subtitle" style="margin-top:2px;font-size:0.75rem;color:var(--muted)"></div>
  </header>

  <nav class="tabs" aria-label="Model selection">
    <button class="tab active" data-tab="mlb-props" type="button">MLB Strikeouts</button>
    <button class="tab" data-tab="nba-props" type="button">NBA Player Props</button>
    <button class="tab" data-tab="ncaa" type="button" style="display:none">NCAA</button>
    <button class="tab" data-tab="nfl" type="button" style="display:none">NFL</button>
    <button class="tab" data-tab="nfl-props" type="button" style="display:none">NFL Player Props</button>
    <button class="tab" data-tab="fullseason" type="button">NBA Full Season</button>
    <button class="tab" data-tab="mlb-batter-props" type="button" style="display:none">MLB Batter Props</button>
  </nav>

  <main class="content" id="content">
    <div class="loading"><div class="spinner"></div><br>Loading picks...</div>
  </main>

  <script src="js/workflow-trigger.js?v=4"></script>
  <script src="js/main.js?v=6"></script>
  <script src="js/nba-props.js?v=6"></script>
  <script src="js/nfl-props.js?v=4"></script>
  <script src="js/nfl-games.js?v=4"></script>
  <script src="js/mlb-props.js?v=30"></script>
  <script>render();</script>
</body>
</html>
