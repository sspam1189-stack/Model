name: NBA Old-Model Walk-Forward (no commit)

# Testing only. Walks an old copy of the Python full-season model (pyFullMar19 =
# 2026-03-19, pyFullApr19 = 2026-04-19; verbatim copies of that day's code) forward over a date range on this season's
# saved inputs, in a throwaway copy, and prints the day-by-day table and the
# totals (job summary + log). Writes nothing to the repo and touches no live
# model, record or dashboard file.

on:
  workflow_dispatch:
    inputs:
      date:
        description: "First day, YYYYMMDD"
        default: "20261023"
      to:
        description: "Last day, YYYYMMDD"
        default: ""
      min_gp:
        description: "Games before a team is projected (the old code requires 15; 1 = from game 1, as the preview does)"
        default: "1"
      version:
        description: "Which copy: mar19 or apr19"
        default: "mar19"

permissions:
  contents: read

jobs:
  walk-forward:
    runs-on: self-hosted
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          clean: true

      - name: Install dependencies
        run: |
          pip install -r pyFull/requirements.txt
          pip install scikit-learn joblib

      - name: Walk forward
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          $dir = if ("${{ inputs.version }}" -eq "apr19") { "pyFullApr19" } else { "pyFullMar19" }
          python "$dir/walk_forward.py" --from ${{ inputs.date }} --to ${{ inputs.to }} --min-gp ${{ inputs.min_gp }} | Tee-Object -FilePath oldmodel.md
          $code = $LASTEXITCODE
          Get-Content oldmodel.md | Add-Content $env:GITHUB_STEP_SUMMARY
          exit $code
