name: Run Daily NCAA

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  ncaa:
    runs-on: self-hosted
    steps:
      - name: Clean up stale rebase
        run: git rebase --abort 2>/dev/null || true
        shell: bash

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: npm ci && npm ci --prefix ../core-js
        working-directory: jsNCAA

      - name: Run daily
        working-directory: jsNCAA
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: node scripts/run_daily.mjs

      - name: Upload jsNCAA data
        uses: actions/upload-artifact@v4
        with:
          name: jsNCAA-data
          path: jsNCAA/data

  commit-and-push:
    runs-on: ubuntu-latest
    needs: [ncaa]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: jsNCAA-data
          path: artifacts/jsNCAA

      - name: Copy artifacts
        shell: bash
        run: |
          cp -a artifacts/jsNCAA/. jsNCAA/data/

      - name: Commit & push data changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jsNCAA/data/
          git diff --cached --quiet || git commit -m "Run daily NCAA"
          git pull --rebase origin main
          git push
