name: Python Run Daily NCAA

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  ncaa:
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    steps:
      - name: Clean up stale rebase
        run: git rebase --abort 2>/dev/null || true

      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install -r pyNCAA/requirements.txt

      - name: Run daily
        working-directory: pyNCAA/scripts
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python run_daily.py

      - name: Upload pyNCAA data
        uses: actions/upload-artifact@v4
        with:
          name: pyNCAA-data
          path: pyNCAA/data

  commit-and-push:
    runs-on: ubuntu-latest
    needs: [ncaa]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: pyNCAA-data
          path: artifacts/pyNCAA

      - name: Copy artifacts
        shell: bash
        run: |
          cp -a artifacts/pyNCAA/. pyNCAA/data/

      - name: Commit & push data changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyNCAA/data/
          git diff --cached --quiet || git commit -m "Run daily Python NCAA"
          git pull --rebase origin main
          git push
