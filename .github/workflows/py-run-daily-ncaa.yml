name: Python Run Daily NCAA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ncaa:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install -r pyNCAA/requirements.txt

      - name: Run daily
        working-directory: pyNCAA/scripts
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python run_daily.py

      - name: Commit & push data changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rebase --abort 2>/dev/null || true
          git add pyNCAA/data/
          git diff --cached --quiet || git commit -m "Run daily Python NCAA"
          git pull --rebase origin main
          git push
