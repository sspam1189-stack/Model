name: Python Run Daily NCAA

on:
  workflow_dispatch:


permissions:
  contents: write

jobs:
  ncaa:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: Clean up stale rebase
        run: git rebase --abort 2>&1 | Out-Null; exit 0

      - uses: actions/checkout@v6
        with:
          ref: main
          clean: true

      - name: Clear bytecode cache
        run: Get-ChildItem -Path pyNCAA/scripts -Filter __pycache__ -Recurse -Directory -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force

      - name: Install dependencies
        run: pip install -r pyNCAA/requirements.txt

      - name: Run daily
        working-directory: pyNCAA/scripts
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python run_daily.py

      - name: Upload pyNCAA data
        uses: actions/upload-artifact@v7
        with:
          name: pyNCAA-data
          path: pyNCAA/data

      - name: Upload shared NCAA odds cache
        uses: actions/upload-artifact@v7
        with:
          name: shared-ncaa-odds-cache
          path: data/odds_cache/ncaab

      - name: Upload shared NCAA stats cache
        uses: actions/upload-artifact@v7
        with:
          name: shared-ncaa-stats-cache
          path: data/stats_cache/ncaab

      - name: Upload shared NCAA ESPN cache
        uses: actions/upload-artifact@v7
        with:
          name: shared-ncaa-espn-cache
          path: data/espn_cache/ncaab

  commit-and-push:
    runs-on: ubuntu-latest
    needs: [ncaa]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: pyNCAA-data
          path: artifacts/pyNCAA

      - uses: actions/download-artifact@v8
        with:
          name: shared-ncaa-odds-cache
          path: artifacts/ncaa-odds-cache

      - uses: actions/download-artifact@v8
        with:
          name: shared-ncaa-stats-cache
          path: artifacts/ncaa-stats-cache

      - uses: actions/download-artifact@v8
        with:
          name: shared-ncaa-espn-cache
          path: artifacts/ncaa-espn-cache

      - name: Copy artifacts
        shell: bash
        run: |
          cp -a artifacts/pyNCAA/. pyNCAA/data/
          mkdir -p data/odds_cache/ncaab
          cp -a artifacts/ncaa-odds-cache/. data/odds_cache/ncaab/
          mkdir -p data/stats_cache/ncaab
          cp -a artifacts/ncaa-stats-cache/. data/stats_cache/ncaab/
          mkdir -p data/espn_cache/ncaab
          cp -a artifacts/ncaa-espn-cache/. data/espn_cache/ncaab/
          cp pyNCAA/data/history.json PythonDashboard/data/ncaa.json

      - name: Commit & push data changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyNCAA/data/ data/odds_cache/ncaab/ data/stats_cache/ncaab/ data/espn_cache/ncaab/ PythonDashboard/data/ncaa.json
          git diff --cached --quiet || git commit -m "Run daily Python NCAA"
          git pull --rebase origin main
          git push
