name: Python Update NCAA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ncaa:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install -r PythonNCAA/requirements.txt

      - name: Run update
        working-directory: PythonNCAA/scripts
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY_PAID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python update.py

      - name: Commit & push data changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PythonNCAA/data/
          git diff --cached --quiet || git commit -m "Update Python NCAA data"
          git pull --rebase origin main
          git push
