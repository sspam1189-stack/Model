name: Run NCAA Combined

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ncaa-js:
    runs-on: self-hosted
    steps:
      - name: Clean up stale rebase
        run: git rebase --abort 2>/dev/null || true
        shell: bash

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        shell: bash
        run: npm ci && npm ci --prefix ../core-js
        working-directory: jsNCAA

      - name: Run daily
        working-directory: jsNCAA
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: node scripts/run_daily.mjs

      - name: Upload jsNCAA data
        uses: actions/upload-artifact@v4
        with:
          name: jsNCAA-data
          path: jsNCAA/data

  ncaa-python:
    needs: ncaa-js
    runs-on: self-hosted
    steps:
      - name: Clean up stale rebase
        run: git rebase --abort 2>/dev/null || true
        shell: bash

      - uses: actions/checkout@v4

      - name: Pull latest changes
        run: git pull origin main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r pyNCAA/requirements.txt

      - name: Run daily
        working-directory: pyNCAA/scripts
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python run_daily.py

      - name: Upload pyNCAA data
        uses: actions/upload-artifact@v4
        with:
          name: pyNCAA-data
          path: pyNCAA/data

  commit-and-push:
    runs-on: ubuntu-latest
    needs: [ncaa-js, ncaa-python]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: jsNCAA-data
          path: artifacts/jsNCAA

      - uses: actions/download-artifact@v4
        with:
          name: pyNCAA-data
          path: artifacts/pyNCAA

      - name: Copy artifacts
        shell: bash
        run: |
          cp -a artifacts/jsNCAA/data/. jsNCAA/data/
          cp -a artifacts/pyNCAA/data/. pyNCAA/data/

      - name: Commit & push data changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jsNCAA/data/ pyNCAA/data/
          git diff --cached --quiet || git commit -m "Run daily NCAA combined"
          git pull --rebase origin main
          git push
