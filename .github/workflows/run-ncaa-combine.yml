name: Run NCAA Combined

on:
  workflow_dispatch:


permissions:
  contents: write

jobs:
  ncaa-js:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: Clean up stale rebase
        run: try { git rebase --abort 2>&1 | Out-Null } catch { }; $true

      - uses: actions/checkout@v6
        with:
          ref: main
          clean: true

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          Set-Location jsNCAA
          npm ci
          npm ci --prefix ../core-js

      - name: Run daily
        working-directory: jsNCAA
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: node scripts/run_daily.mjs

      - name: Upload jsNCAA data
        uses: actions/upload-artifact@v7
        with:
          name: jsNCAA-data
          path: jsNCAA/data

      - name: Upload shared NCAA odds cache
        uses: actions/upload-artifact@v7
        with:
          name: shared-ncaa-odds-cache
          path: data/odds_cache/ncaab

      - name: Upload shared NCAA stats cache
        uses: actions/upload-artifact@v7
        with:
          name: shared-ncaa-stats-cache
          path: data/stats_cache/ncaab

      - name: Upload shared NCAA ESPN cache
        uses: actions/upload-artifact@v7
        with:
          name: shared-ncaa-espn-cache
          path: data/espn_cache/ncaab

  ncaa-python:
    needs: ncaa-js
    runs-on: self-hosted
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Clean up stale rebase
        run: try { git rebase --abort 2>&1 | Out-Null } catch { }; $true

      - uses: actions/checkout@v6
        with:
          ref: main
          clean: true

      - name: Pull latest changes
        run: git pull origin main

      - name: Resolve Python
        id: py
        run: |
          $cmd = Get-Command python -ErrorAction SilentlyContinue
          if (-not $cmd) { $cmd = Get-Command py -ErrorAction SilentlyContinue }
          if (-not $cmd) { throw "Python not found on PATH. Install Python on the self-hosted runner." }
          "PY_CMD=$($cmd.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Python version
        run: |
          & ${{ steps.py.outputs.PY_CMD }} --version
          & ${{ steps.py.outputs.PY_CMD }} -m pip --version

      - name: Install dependencies
        run: |
          & ${{ steps.py.outputs.PY_CMD }} -m pip install -r pyNCAA/requirements.txt

      - name: Run daily
        working-directory: pyNCAA/scripts
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: |
          & ${{ steps.py.outputs.PY_CMD }} run_daily.py

      - name: Upload pyNCAA data
        uses: actions/upload-artifact@v7
        with:
          name: pyNCAA-data
          path: pyNCAA/data

  commit-and-push:
    runs-on: ubuntu-latest
    needs: [ncaa-js, ncaa-python]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: jsNCAA-data
          path: artifacts/jsNCAA

      - uses: actions/download-artifact@v8
        with:
          name: pyNCAA-data
          path: artifacts/pyNCAA

      - uses: actions/download-artifact@v8
        with:
          name: shared-ncaa-odds-cache
          path: artifacts/ncaa-odds-cache

      - uses: actions/download-artifact@v8
        with:
          name: shared-ncaa-stats-cache
          path: artifacts/ncaa-stats-cache

      - uses: actions/download-artifact@v8
        with:
          name: shared-ncaa-espn-cache
          path: artifacts/ncaa-espn-cache

      - name: Copy artifacts
        shell: bash
        run: |
          cp -a artifacts/jsNCAA/. jsNCAA/data/
          cp -a artifacts/pyNCAA/. pyNCAA/data/
          mkdir -p data/odds_cache/ncaab
          cp -a artifacts/ncaa-odds-cache/. data/odds_cache/ncaab/
          mkdir -p data/stats_cache/ncaab
          cp -a artifacts/ncaa-stats-cache/. data/stats_cache/ncaab/
          mkdir -p data/espn_cache/ncaab
          cp -a artifacts/ncaa-espn-cache/. data/espn_cache/ncaab/
          cp jsNCAA/data/history.json Dashboard/data/ncaa.json
          cp pyNCAA/data/history.json PythonDashboard/data/ncaa.json

      - name: Commit & push data changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jsNCAA/data/ pyNCAA/data/ data/odds_cache/ncaab/ data/stats_cache/ncaab/ data/espn_cache/ncaab/ Dashboard/data/ncaa.json PythonDashboard/data/ncaa.json
          git diff --cached --quiet || git commit -m "Run daily NCAA combined"
          git pull --rebase origin main
          git push
