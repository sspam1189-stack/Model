name: Recap Daily NCAA

on:
  workflow_dispatch:

jobs:
  ncaa:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci
        working-directory: NCAA

      - name: Run recap daily
        working-directory: NCAA
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY_PAID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: node scripts/RECAPrun_daily.mjs

      - name: Commit & push data changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Recap daily NCAA"
          git push
