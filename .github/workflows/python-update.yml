name: Python Update (NBA + Fullseason)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  python-nba:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 python-dotenv scipy
        working-directory: PythonNBA

      - name: Run update
        working-directory: PythonNBA/scripts
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY_PAID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python update.py

      - name: Commit & push data changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update Python NBA data"
          git pull --rebase origin main
          git push

  python-fullseason:
    runs-on: self-hosted
    needs: python-nba
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pull latest
        run: git pull origin main

      - name: Install dependencies
        run: pip install requests beautifulsoup4 python-dotenv scipy
        working-directory: PythonFull

      - name: Run update
        working-directory: PythonFull/scripts
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY_PAID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python update.py

      - name: Commit & push data changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update Python Fullseason data"
          git pull --rebase origin main
          git push
