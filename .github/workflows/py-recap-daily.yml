name: Python Recap Daily (NBA + Fullseason)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nba:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install -r PythonNBA/requirements.txt

      - name: Run recap daily
        working-directory: PythonNBA/scripts
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY_PAID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python recap_run_daily.py

      - name: Commit & push data changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PythonNBA/data/
          git diff --cached --quiet || git commit -m "Recap daily Python NBA"
          git pull --rebase origin main
          git push

  nba-fullseason:
    runs-on: self-hosted
    needs: nba
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Pull latest
        run: git pull origin main

      - name: Install dependencies
        run: pip install -r PythonFull/requirements.txt

      - name: Run recap daily
        working-directory: PythonFull/scripts
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY_PAID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python recap_run_daily.py

      - name: Commit & push data changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PythonFull/data/
          git diff --cached --quiet || git commit -m "Recap daily Python Fullseason"
          git pull --rebase origin main
          git push
