name: Python Run Daily WNBA (Fullseason + Props)

on:
  workflow_dispatch:


permissions:
  contents: write

# Serialize runs: a second dispatch queues behind any in-progress run instead
# of executing in parallel. Prevents two runs writing the same data files and
# conflicting on push.
concurrency:
  group: wnba-run-daily
  cancel-in-progress: false

jobs:
  wnba-fullseason:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: Clean up stale rebase
        run: $ErrorActionPreference='SilentlyContinue'; git rebase --abort 2>&1 | Out-Null; exit 0

      - uses: actions/checkout@v6
        with:
          ref: main
          clean: true

      - name: Pull latest
        run: |
          git config --global --add safe.directory '*'
          git pull origin main

      - name: Clear bytecode cache
        run: Get-ChildItem -Path pyWNBAFull/scripts -Filter __pycache__ -Recurse -Directory -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force

      - name: Install dependencies
        run: pip install -r pyWNBAFull/requirements.txt

      - name: Run daily
        working-directory: pyWNBAFull/scripts
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python run_daily.py

      - name: Copy dashboard data
        run: Copy-Item pyWNBAFull/data/history.json PythonDashboard/data/wnba-full.json -Force

      - name: Commit & push WNBA Fullseason data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Scope strictly to pyWNBAFull-owned paths (caches are self-contained
          # under pyWNBAFull/data) so a parallel pyWNBAPROPS push can't race us.
          git add pyWNBAFull/data/ PythonDashboard/data/wnba-full.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "Run daily WNBA Fullseason [skip ci]"
          $tries = 0
          while ($tries -lt 5) {
            git pull --rebase --autostash origin main
            git push
            if ($LASTEXITCODE -eq 0) { exit 0 }
            $tries++
            Start-Sleep -Seconds 5
          }
          exit 1

  wnba-props:
    needs: wnba-fullseason
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: Clean up stale rebase
        run: $ErrorActionPreference='SilentlyContinue'; git rebase --abort 2>&1 | Out-Null; exit 0

      - uses: actions/checkout@v6
        with:
          ref: main
          clean: true

      - name: Pull latest
        run: |
          git config --global --add safe.directory '*'
          git pull origin main

      - name: Clear bytecode cache
        run: Get-ChildItem -Path pyWNBAPROPS -Filter __pycache__ -Recurse -Directory -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force

      - name: Install dependencies
        run: pip install -r pyWNBAPROPS/requirements.txt

      - name: Run daily WNBA props
        working-directory: pyWNBAPROPS
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: python -m scripts.run_daily

      - name: Copy dashboard data
        run: Copy-Item pyWNBAPROPS/data/wnba-props.json PythonDashboard/data/wnba-props.json -Force -ErrorAction SilentlyContinue

      - name: Commit & push WNBA Props data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Scope strictly to pyWNBAPROPS-owned paths (caches are self-contained
          # under pyWNBAPROPS/data) so a parallel pyWNBAFull push can't race us.
          git add pyWNBAPROPS/data/ PythonDashboard/data/wnba-props.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "Run daily WNBA Props [skip ci]"
          $tries = 0
          while ($tries -lt 5) {
            git pull --rebase --autostash origin main
            git push
            if ($LASTEXITCODE -eq 0) { exit 0 }
            $tries++
            Start-Sleep -Seconds 5
          }
          exit 1
