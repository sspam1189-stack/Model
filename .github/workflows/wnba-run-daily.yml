name: Python Run Daily WNBA (Fullseason + Props)

on:
  workflow_dispatch:
  schedule:
    # 10:45 AM and 4:45 PM CT (CDT = UTC-5 during the WNBA season).
    # GitHub cron is UTC and only fires on the default branch. :45 keeps us off
    # the congested :00/:30 marks (those get delayed/dropped first).
    - cron: '45 15 * * *'   # 15:45 UTC = 10:45 AM CT
    - cron: '45 21 * * *'   # 21:45 UTC =  4:45 PM CT


permissions:
  contents: write

# Serialize runs: a second dispatch queues behind any in-progress run instead
# of executing in parallel. Prevents two runs writing the same data files and
# conflicting on push.
concurrency:
  group: wnba-run-daily
  cancel-in-progress: false

# Single job: run Fullseason then Props, then commit + push ONCE. Previously
# these were two jobs that each committed and pushed, producing TWO commits to
# main per run — and therefore two GitHub Pages deploys. Consolidating to one
# push means one deploy per run (halves this workflow's deploy load).
jobs:
  wnba:
    # Self-hosted runner (same as the MLB daily): GitHub-hosted IPs are refused
    # by stats.nba.com, so the WNBA stats fetch fails from windows-latest but
    # works from the self-hosted runner's IP. Moved 2026-07-28.
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: Clean up stale rebase
        run: $ErrorActionPreference='SilentlyContinue'; git rebase --abort 2>&1 | Out-Null; exit 0

      - uses: actions/checkout@v6
        with:
          ref: main
          clean: true

      - name: Pull latest
        run: |
          git config --global --add safe.directory '*'
          git pull origin main

      # ---------- Fullseason ----------
      - name: Clear bytecode cache (fullseason)
        run: Get-ChildItem -Path pyWNBAFull/scripts -Filter __pycache__ -Recurse -Directory -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force

      - name: Install dependencies (fullseason)
        run: pip install -r pyWNBAFull/requirements.txt

      - name: Run daily (fullseason)
        working-directory: pyWNBAFull/scripts
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python run_daily.py

      - name: Copy dashboard data (fullseason)
        run: Copy-Item pyWNBAFull/data/history.json PythonDashboard/data/wnba-full.json -Force

      # ---------- Props ----------
      - name: Clear bytecode cache (props)
        run: Get-ChildItem -Path pyWNBAPROPS -Filter __pycache__ -Recurse -Directory -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force

      - name: Install dependencies (props)
        run: pip install -r pyWNBAPROPS/requirements.txt

      - name: Run daily WNBA props
        working-directory: pyWNBAPROPS
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: python -m scripts.run_daily

      - name: Copy dashboard data (props)
        run: Copy-Item pyWNBAPROPS/data/wnba-props.json PythonDashboard/data/wnba-props.json -Force -ErrorAction SilentlyContinue

      # ---------- Single commit & push (one deploy) ----------
      # Runs even if a run step above failed (but not on cancel), so a props
      # failure still commits the fullseason data — same resilience the old
      # two-push layout had, but in a single commit.
      - name: Commit & push WNBA data (single push)
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyWNBAFull/data/ pyWNBAPROPS/data/ PythonDashboard/data/wnba-full.json PythonDashboard/data/wnba-props.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "Run daily WNBA (Fullseason + Props) [skip ci]"
          $tries = 0
          while ($tries -lt 5) {
            git pull --rebase --autostash origin main
            git push
            if ($LASTEXITCODE -eq 0) { exit 0 }
            $tries++
            Start-Sleep -Seconds 5
          }
          exit 1
