name: Python Run NFL Player Props

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nfl-props:
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    steps:
      - name: Clean up stale rebase
        run: git rebase --abort 2>/dev/null || true

      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install -r pyNFL/requirements.txt

      - name: Run props backtest
        working-directory: pyNFL/scripts
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python props_backtest.py --seasons 2023 2024 2025 --real-lines --write-json

      - name: Upload pyNFL data
        uses: actions/upload-artifact@v4
        with:
          name: pyNFL-props-data
          path: |
            pyNFL/data/nfl-props.json
            PythonDashboard/data/nfl-props.json

  commit-and-push:
    runs-on: ubuntu-latest
    needs: nfl-props
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: pyNFL-props-data
          path: artifacts/props

      - name: Copy artifacts
        shell: bash
        run: |
          cp -f artifacts/props/pyNFL/data/nfl-props.json pyNFL/data/nfl-props.json
          cp -f artifacts/props/PythonDashboard/data/nfl-props.json PythonDashboard/data/nfl-props.json

      - name: Commit & push data changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyNFL/data/nfl-props.json PythonDashboard/data/nfl-props.json
          git diff --cached --quiet || git commit -m "Run NFL player props backtest"
          git pull --rebase origin main
          git push
