name: Recap Daily (NBA + Fullseason)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nba:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci
        working-directory: NBA

      - name: Run recap daily
        working-directory: NBA
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: node scripts/RECAPrun_daily.mjs

      - name: Commit & push data changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add NBA/data/
          git diff --cached --quiet || git commit -m "Recap daily NBA"
          git pull --rebase origin main
          git push

  nba-fullseason:
    runs-on: self-hosted
    needs: nba
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pull latest
        run: git pull origin main

      - name: Install dependencies
        run: npm ci
        working-directory: NBAFullseason

      - name: Run recap daily
        working-directory: NBAFullseason
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: node scripts/RECAPrun_daily.mjs

      - name: Commit & push data changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add NBAFullseason/data/
          git diff --cached --quiet || git commit -m "Recap daily NBA Fullseason"
          git pull --rebase origin main
          git push
