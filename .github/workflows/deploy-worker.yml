name: Deploy Workflow Proxy Worker

# Deploys cloudflare-worker/ (the "Run ... Daily" button proxy,
# pydashboard-workflow-proxy) whenever its code changes on main.
#
# Why this exists: Cloudflare Workers Builds deploys from the repo ROOT, where
# wrangler.jsonc (name "model", dashboard assets only) wins over wrangler.toml,
# so pushes never reached pydashboard-workflow-proxy. The button worker sat on
# a pre-2026-10-08 build with no "nfl" entry, and Run NFL Daily got HTTP 400.
#
# Needs repo secret CLOUDFLARE_API_TOKEN (Cloudflare API token with the
# "Edit Cloudflare Workers" template). CLOUDFLARE_ACCOUNT_ID is optional --
# only needed if the token can see more than one account.
# The worker's own secrets (GH_TOKEN, ACCESS_KEY) live in Cloudflare and are
# kept across deploys.

on:
  push:
    branches: [main]
    paths:
      - "cloudflare-worker/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare token
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::error::Repo secret CLOUDFLARE_API_TOKEN is not set (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Deploy pydashboard-workflow-proxy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-worker
          command: deploy
