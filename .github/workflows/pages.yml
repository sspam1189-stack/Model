name: Deploy Pages (debounced)

# Replaces GitHub's auto-generated "pages build and deployment", which fired on
# EVERY push to main. Because many workflows commit to main frequently (MLB
# whiff+CSW, WNBA, NCAA, NFL daily runs, dashboard sync, plus manual pushes) and
# the github-pages environment is single-concurrency, deploys piled up: they sat
# in `deployment_queued` for many minutes and, once the wait crossed the
# deploy-pages 10-minute timeout, FAILED ("Timeout reached, aborting!"), leaving
# the live site stale until one got through.
#
# This runs the SAME Jekyll build (so every existing /Model/... URL is preserved)
# but only on a 30-minute schedule + manual dispatch. The frequent data commits
# now batch into at most one deploy per window instead of dozens, so the Pages
# environment is never saturated.
#
# REQUIRES A ONE-TIME SETTING: Settings -> Pages -> Source = "GitHub Actions".
# Making that switch also stops the old auto build, so there is no duplicate.
# Until it is set, the deploy step cannot publish.

on:
  schedule:
    - cron: '15,45 * * * *'   # :15 and :45 each hour -> 30-min deploy cadence
  workflow_dispatch: {}        # manual "deploy now" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deploys and let an in-flight one finish rather than cancelling it —
# cancelling a Pages deploy leaves the environment locked and cascades into the
# next deploy timing out too.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
