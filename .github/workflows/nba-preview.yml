name: NBA Projection Preview (no commit)

# Runs all three NBA full-season models on today's live stats and lines with
# the burn-in lowered, in a throwaway copy, and prints the projections side by
# side (job summary + log). Writes nothing to the repo.

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Past day YYYYMMDD (blank = today, live)"
        default: ""
      to:
        description: "Optional last day YYYYMMDD: replay date..to in order (walk-forward)"
        default: ""
      seed:
        description: "With date+to: write the replayed days into each model's live history (commits)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  preview:
    runs-on: self-hosted
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          clean: true

      - name: Install dependencies
        run: pip install -r pyFull/requirements.txt

      - name: Preview projections
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          if ("${{ inputs.date }}" -and "${{ inputs.to }}" -and "${{ inputs.seed }}" -eq "true") { python pyFull/scripts/preview_today.py --date ${{ inputs.date }} --to ${{ inputs.to }} --seed }
          elseif ("${{ inputs.date }}" -and "${{ inputs.to }}") { python pyFull/scripts/preview_today.py --date ${{ inputs.date }} --to ${{ inputs.to }} }
          elseif ("${{ inputs.date }}") { python pyFull/scripts/preview_today.py --date ${{ inputs.date }} }
          else { python pyFull/scripts/preview_today.py }
          exit $LASTEXITCODE

      - name: Commit seeded history
        if: ${{ inputs.seed }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyFull/data/history.json pyFullKalmanOff/data/history.json pyFullDNET/data/history.json pyFullKalmanEarly/data/history.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "Seed NBA full-season histories with walk-forward ${{ inputs.date }}-${{ inputs.to }} [skip ci]"
          $tries = 0
          while ($tries -lt 5) {
            git pull --rebase --autostash origin main
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) { exit 0 }
            $tries++
            Start-Sleep -Seconds 5
          }
          exit 1
