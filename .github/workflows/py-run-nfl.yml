name: Python Run NFL (Weekly Picks)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nfl:
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    steps:
      - name: Clean up stale rebase
        run: git rebase --abort 2>/dev/null || true

      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install -r pyNFL/requirements.txt

      - name: Run weekly picks
        working-directory: pyNFL/scripts
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python run_weekly.py

      - name: Upload pyNFL data
        uses: actions/upload-artifact@v4
        with:
          name: pyNFL-data
          path: pyNFL/data

  commit-and-push:
    runs-on: ubuntu-latest
    needs: nfl
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: pyNFL-data
          path: artifacts/pyNFL

      - name: Copy artifacts
        shell: bash
        run: cp -a artifacts/pyNFL/. pyNFL/data/

      - name: Commit & push data changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyNFL/data/
          git diff --cached --quiet || git commit -m "Run weekly NFL picks"
          git pull --rebase origin main
          git push
