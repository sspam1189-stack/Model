name: Run Daily (NBA + Fullseason)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nba:
    runs-on: self-hosted
    steps:
      - name: Clean up stale rebase
        run: git rebase --abort 2>/dev/null || true
        shell: bash

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        shell: bash
        run: npm ci && npm ci --prefix ../core-js
        working-directory: jsNBA

      - name: Run daily
        working-directory: jsNBA
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: node scripts/run_daily.mjs

      - name: Commit & push data changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jsNBA/data/
          git diff --cached --quiet || git commit -m "Run daily NBA"
          git pull --rebase origin main
          git push

  nba-fullseason:
    runs-on: self-hosted
    needs: nba
    steps:
      - name: Clean up stale rebase
        run: git rebase --abort 2>/dev/null || true
        shell: bash

      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pull latest
        run: git pull origin main

      - name: Install dependencies
        shell: bash
        run: npm ci && npm ci --prefix ../core-js
        working-directory: jsFull

      - name: Run daily
        working-directory: jsFull
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: node scripts/run_daily.mjs

      - name: Commit & push data changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jsFull/data/
          git diff --cached --quiet || git commit -m "Run daily NBA Fullseason"
          git pull --rebase origin main
          git push
