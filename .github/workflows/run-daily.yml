name: Run Daily (NBA + Fullseason)

on:
  workflow_dispatch:


permissions:
  contents: write

jobs:
  nba:
    runs-on: self-hosted
    steps:
      - name: Clean up stale rebase
        run: git rebase --abort 2>/dev/null || true
        shell: bash

      - uses: actions/checkout@v6
        with:
          ref: main
          clean: true

      - name: Pull latest
        run: git pull origin main
        shell: bash

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: npm ci && npm ci --prefix ../core-js
        working-directory: jsNBA

      - name: Run daily
        working-directory: jsNBA
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: node scripts/run_daily.mjs

      - name: Upload jsNBA data
        uses: actions/upload-artifact@v7
        with:
          name: jsNBA-data
          path: jsNBA/data

  nba-fullseason:
    runs-on: self-hosted
    needs: nba
    steps:
      - name: Clean up stale rebase
        run: git rebase --abort 2>/dev/null || true
        shell: bash

      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Pull latest
        run: git pull origin main

      - name: Install dependencies
        shell: bash
        run: npm ci && npm ci --prefix ../core-js
        working-directory: jsFull

      - name: Run daily
        working-directory: jsFull
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: node scripts/run_daily.mjs

      - name: Upload jsFull data
        uses: actions/upload-artifact@v7
        with:
          name: jsFull-data
          path: jsFull/data

  commit-and-push:
    runs-on: ubuntu-latest
    needs: [nba, nba-fullseason]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: jsNBA-data
          path: artifacts/jsNBA

      - uses: actions/download-artifact@v8
        with:
          name: jsFull-data
          path: artifacts/jsFull

      - name: Copy artifacts
        shell: bash
        run: |
          cp -a artifacts/jsNBA/. jsNBA/data/
          cp -a artifacts/jsFull/. jsFull/data/
          cp jsNBA/data/history.json Dashboard/data/nba.json
          cp jsFull/data/history.json Dashboard/data/fullseason.json

      - name: Commit & push data changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jsNBA/data/ jsFull/data/ Dashboard/data/nba.json Dashboard/data/fullseason.json
          git diff --cached --quiet || git commit -m "Run daily NBA + Fullseason"
          git pull --rebase origin main
          git push
