name: Run Daily (NBA + Fullseason)

on:
  workflow_dispatch:


permissions:
  contents: write

jobs:
  nba:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: Clean up stale rebase
        run: git rebase --abort 2>$null; $true

      - uses: actions/checkout@v6
        with:
          ref: main
          clean: true

      - name: Pull latest
        run: git pull origin main

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          Set-Location jsNBA
          npm ci
          npm ci --prefix ../core-js

      - name: Run daily
        working-directory: jsNBA
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: node scripts/run_daily.mjs

      - name: Upload jsNBA data
        uses: actions/upload-artifact@v7
        with:
          name: jsNBA-data
          path: jsNBA/data

      - name: Upload shared injury cache
        uses: actions/upload-artifact@v7
        with:
          name: shared-injury-cache
          path: data/injury_cache/nba

      - name: Upload shared odds cache
        uses: actions/upload-artifact@v7
        with:
          name: shared-odds-cache
          path: data/odds_cache/nba

      - name: Upload shared stats cache
        uses: actions/upload-artifact@v7
        with:
          name: shared-stats-cache
          path: data/stats_cache/nba

      - name: Upload shared ESPN cache
        uses: actions/upload-artifact@v7
        with:
          name: shared-espn-cache
          path: data/espn_cache/nba

  nba-fullseason:
    runs-on: self-hosted
    needs: nba
    defaults:
      run:
        shell: powershell
    steps:
      - name: Clean up stale rebase
        run: git rebase --abort 2>$null; $true

      - uses: actions/checkout@v6
        with:
          ref: main
          clean: true

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Pull latest
        run: git pull origin main

      - name: Install dependencies
        run: |
          Set-Location jsFull
          npm ci
          npm ci --prefix ../core-js

      - name: Run daily
        working-directory: jsFull
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: node scripts/run_daily.mjs

      - name: Upload jsFull data
        uses: actions/upload-artifact@v7
        with:
          name: jsFull-data
          path: jsFull/data

  commit-and-push:
    runs-on: ubuntu-latest
    needs: [nba, nba-fullseason]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: jsNBA-data
          path: artifacts/jsNBA

      - uses: actions/download-artifact@v8
        with:
          name: jsFull-data
          path: artifacts/jsFull

      - uses: actions/download-artifact@v8
        with:
          name: shared-injury-cache
          path: artifacts/injury-cache

      - uses: actions/download-artifact@v8
        with:
          name: shared-odds-cache
          path: artifacts/odds-cache

      - uses: actions/download-artifact@v8
        with:
          name: shared-stats-cache
          path: artifacts/stats-cache

      - uses: actions/download-artifact@v8
        with:
          name: shared-espn-cache
          path: artifacts/espn-cache

      - name: Copy artifacts
        shell: bash
        run: |
          cp -a artifacts/jsNBA/. jsNBA/data/
          cp -a artifacts/jsFull/. jsFull/data/
          mkdir -p data/injury_cache/nba
          cp -a artifacts/injury-cache/. data/injury_cache/nba/
          mkdir -p data/odds_cache/nba
          cp -a artifacts/odds-cache/. data/odds_cache/nba/
          mkdir -p data/stats_cache/nba
          cp -a artifacts/stats-cache/. data/stats_cache/nba/
          mkdir -p data/espn_cache/nba
          cp -a artifacts/espn-cache/. data/espn_cache/nba/
          cp jsNBA/data/history.json Dashboard/data/nba.json
          cp jsFull/data/history.json Dashboard/data/fullseason.json

      - name: Commit & push data changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jsNBA/data/ jsFull/data/ data/injury_cache/nba/ data/odds_cache/nba/ data/stats_cache/nba/ data/espn_cache/nba/ Dashboard/data/nba.json Dashboard/data/fullseason.json
          git diff --cached --quiet || git commit -m "Run daily NBA + Fullseason"
          git pull --rebase origin main
          git push
