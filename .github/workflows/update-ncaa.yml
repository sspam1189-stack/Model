name: Update NCAA

on:
  workflow_dispatch:

jobs:
  ncaa:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci
        working-directory: NCAA

      - name: Run update
        working-directory: NCAA
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY_PAID }}
        run: node scripts/update.mjs

      - name: Commit & push data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update NCAA data"
          git push
