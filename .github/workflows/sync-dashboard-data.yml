name: Sync Dashboard Data

on:
  # Hourly schedule disabled 2026-08-04 (user): the only scheduled runs should be
  # MLB Run Daily on the self-hosted runners. In-season models (MLB, WNBA) write
  # to PythonDashboard/data via their own daily workflows; this only synced
  # offseason models (NBA/NFL/NCAA) + a redundant mlb-props copy. Kept as a
  # manual (workflow_dispatch) sync -- re-enable the cron when those return.
  #  schedule:
  #    - cron: '0 * * * *'
  workflow_dispatch:


permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          clean: true

      - name: Sync Python Dashboard data
        run: |
          cp pyFull/data/history.json PythonDashboard/data/fullseason.json
          cp pyNCAA/data/history.json PythonDashboard/data/ncaa.json
          cp -f pyNFL/data/nfl.json PythonDashboard/data/nfl.json 2>/dev/null || true
          cp -f pyNBAPROPS/data/nba-props.json PythonDashboard/data/nba-props.json 2>/dev/null || true
          cp -f pyNFL/data/nfl-props.json PythonDashboard/data/nfl-props.json 2>/dev/null || true
          cp -f MLBstrikeouts/data/mlb-props.json PythonDashboard/data/mlb-props.json 2>/dev/null || true

      - name: Commit and push if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PythonDashboard/data/
          git diff --staged --quiet || (git commit -m "Sync dashboard data snapshots [skip ci]" && git push)
