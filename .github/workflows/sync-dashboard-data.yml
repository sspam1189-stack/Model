name: Sync Dashboard Data

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:


permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          clean: true

      - name: Sync JS Dashboard data
        run: |
          cp jsNBA/data/history.json Dashboard/data/nba.json
          cp jsFull/data/history.json Dashboard/data/fullseason.json
          cp jsNCAA/data/history.json Dashboard/data/ncaa.json

      - name: Sync Python Dashboard data
        run: |
          cp pyNBA/data/history.json PythonDashboard/data/nba.json
          cp pyFull/data/history.json PythonDashboard/data/fullseason.json
          cp pyNCAA/data/history.json PythonDashboard/data/ncaa.json
          cp pyNFL/data/nfl.json PythonDashboard/data/nfl.json

      - name: Commit and push if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Dashboard/data/ PythonDashboard/data/
          git diff --staged --quiet || (git commit -m "Sync dashboard data snapshots [skip ci]" && git push)
