name: Python Run Daily (Fullseason + NBA Props)

on:
  workflow_dispatch:


permissions:
  contents: write

# Serialize runs: a second dispatch queues behind any in-progress run instead
# of executing in parallel. Prevents two runs writing the same data files and
# conflicting on push.
concurrency:
  group: py-run-daily
  cancel-in-progress: false

jobs:
  nba-fullseason:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: Clean up stale rebase
        run: $ErrorActionPreference='SilentlyContinue'; git rebase --abort 2>&1 | Out-Null; exit 0

      - uses: actions/checkout@v6
        with:
          ref: main
          clean: true

      - name: Pull latest
        run: |
          git config --global --add safe.directory '*'
          git pull origin main

      - name: Clear bytecode cache
        run: Get-ChildItem -Path pyFull/scripts -Filter __pycache__ -Recurse -Directory -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force

      - name: Install dependencies
        run: pip install -r pyFull/requirements.txt

      - name: Run daily
        working-directory: pyFull/scripts
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python run_daily.py

      - name: Copy dashboard data
        run: Copy-Item pyFull/data/history.json PythonDashboard/data/fullseason.json -Force

      - name: Commit & push Fullseason data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Scope to pyFull-owned paths so a parallel pyNBAPROPS push can't race us.
          git add pyFull/data/ PythonDashboard/data/fullseason.json data/odds_cache/nba/ data/stats_cache/nba/ data/injury_cache/nba/ data/espn_cache/nba/
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "Run daily Python Fullseason [skip ci]"
          $tries = 0
          while ($tries -lt 5) {
            git pull --rebase --autostash origin main
            git push
            if ($LASTEXITCODE -eq 0) { exit 0 }
            $tries++
            Start-Sleep -Seconds 5
          }
          exit 1

  nba-props:
    needs: nba-fullseason
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: Clean up stale rebase
        run: $ErrorActionPreference='SilentlyContinue'; git rebase --abort 2>&1 | Out-Null; exit 0

      - uses: actions/checkout@v6
        with:
          ref: main
          clean: true

      - name: Pull latest
        run: |
          git config --global --add safe.directory '*'
          git pull origin main

      - name: Clear bytecode cache
        run: Get-ChildItem -Path pyNBAPROPS -Filter __pycache__ -Recurse -Directory -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force

      - name: Install dependencies
        run: pip install -r pyNBAPROPS/requirements.txt

      - name: Run daily NBA props
        working-directory: pyNBAPROPS
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: python -m scripts.run_daily

      - name: Copy dashboard data
        run: Copy-Item pyNBAPROPS/data/nba-props.json PythonDashboard/data/nba-props.json -Force -ErrorAction SilentlyContinue

      - name: Commit & push NBA Props data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Scope to pyNBAPROPS-owned paths so a parallel pyFull push can't race us.
          git add pyNBAPROPS/data/ PythonDashboard/data/nba-props.json data/player_cache/nba/ data/props_cache/nba/ data/injury_cache/nba/ data/espn_cache/nba/
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "Run daily Python NBA Props [skip ci]"
          $tries = 0
          while ($tries -lt 5) {
            git pull --rebase --autostash origin main
            git push
            if ($LASTEXITCODE -eq 0) { exit 0 }
            $tries++
            Start-Sleep -Seconds 5
          }
          exit 1
