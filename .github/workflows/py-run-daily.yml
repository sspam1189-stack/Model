name: Python Run Daily (NBA + Fullseason + NBA Props)

on:
  workflow_dispatch:


permissions:
  contents: write

jobs:
  nba:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: Clean up stale rebase
        run: $ErrorActionPreference='SilentlyContinue'; git rebase --abort 2>&1 | Out-Null; exit 0

      - uses: actions/checkout@v6
        with:
          ref: main
          clean: true

      - name: Pull latest
        run: git pull origin main

      - name: Clear bytecode cache
        run: Get-ChildItem -Path pyNBA/scripts -Filter __pycache__ -Recurse -Directory -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force

      - name: Install dependencies
        run: pip install -r pyNBA/requirements.txt

      - name: Run daily
        working-directory: pyNBA/scripts
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python run_daily.py

      - name: Copy dashboard data
        shell: bash
        run: cp pyNBA/data/history.json PythonDashboard/data/nba.json

      - name: Commit & push NBA data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyNBA/data/ data/injury_cache/nba/ data/odds_cache/nba/ data/stats_cache/nba/ data/espn_cache/nba/ PythonDashboard/data/nba.json
          git diff --cached --quiet || git commit -m "Run daily Python NBA [skip ci]"
          git pull --rebase origin main
          git push

  nba-fullseason:
    runs-on: self-hosted
    needs: nba
    defaults:
      run:
        shell: powershell
    steps:
      - name: Clean up stale rebase
        run: $ErrorActionPreference='SilentlyContinue'; git rebase --abort 2>&1 | Out-Null; exit 0

      - uses: actions/checkout@v6
        with:
          ref: main
          clean: true

      - name: Pull latest
        run: git pull origin main

      - name: Clear bytecode cache
        run: Get-ChildItem -Path pyFull/scripts -Filter __pycache__ -Recurse -Directory -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force

      - name: Install dependencies
        run: pip install -r pyFull/requirements.txt

      - name: Run daily
        working-directory: pyFull/scripts
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python run_daily.py

      - name: Copy dashboard data
        shell: bash
        run: cp pyFull/data/history.json PythonDashboard/data/fullseason.json

      - name: Commit & push Fullseason data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyFull/data/ PythonDashboard/data/fullseason.json
          git diff --cached --quiet || git commit -m "Run daily Python Fullseason [skip ci]"
          git pull --rebase origin main
          git push

  nba-props:
    runs-on: self-hosted
    needs: nba-fullseason
    defaults:
      run:
        shell: powershell
    steps:
      - name: Clean up stale rebase
        run: $ErrorActionPreference='SilentlyContinue'; git rebase --abort 2>&1 | Out-Null; exit 0

      - uses: actions/checkout@v6
        with:
          ref: main
          clean: true

      - name: Pull latest
        run: git pull origin main

      - name: Clear bytecode cache
        run: Get-ChildItem -Path pyNBAPROPS -Filter __pycache__ -Recurse -Directory -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force

      - name: Install dependencies
        run: pip install -r pyNBAPROPS/requirements.txt

      - name: Run daily NBA props
        working-directory: pyNBAPROPS
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: python -m scripts.run_daily

      - name: Copy dashboard data
        shell: bash
        run: cp -f pyNBAPROPS/data/nba-props.json PythonDashboard/data/nba-props.json 2>/dev/null || true

      - name: Commit & push NBA Props data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyNBAPROPS/data/ data/props_cache/nba/ PythonDashboard/data/nba-props.json
          git diff --cached --quiet || git commit -m "Run daily Python NBA Props [skip ci]"
          git pull --rebase origin main
          git push
