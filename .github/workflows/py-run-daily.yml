name: Python Run Daily (NBA + Fullseason + NBA Props)

on:
  workflow_dispatch:


permissions:
  contents: write

jobs:
  nba:
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    steps:
      - name: Clean up stale rebase
        run: git rebase --abort 2>/dev/null || true

      - uses: actions/checkout@v6
        with:
          ref: main
          clean: true

      - name: Pull latest
        run: git pull origin main

      - name: Clear bytecode cache
        run: find pyNBA/scripts -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true

      - name: Install dependencies
        run: pip install -r pyNBA/requirements.txt

      - name: Run daily
        working-directory: pyNBA/scripts
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python run_daily.py

      - name: Upload pyNBA data
        uses: actions/upload-artifact@v7
        with:
          name: pyNBA-data
          path: pyNBA/data

      - name: Upload shared injury cache
        uses: actions/upload-artifact@v7
        with:
          name: shared-injury-cache
          path: data/injury_cache/nba

      - name: Upload shared odds cache
        uses: actions/upload-artifact@v7
        with:
          name: shared-odds-cache
          path: data/odds_cache/nba

      - name: Upload shared stats cache
        uses: actions/upload-artifact@v7
        with:
          name: shared-stats-cache
          path: data/stats_cache/nba

      - name: Upload shared ESPN cache
        uses: actions/upload-artifact@v7
        with:
          name: shared-espn-cache
          path: data/espn_cache/nba

  nba-fullseason:
    runs-on: self-hosted
    needs: nba
    defaults:
      run:
        shell: bash
    steps:
      - name: Clean up stale rebase
        run: git rebase --abort 2>/dev/null || true

      - uses: actions/checkout@v6
        with:
          ref: main
          clean: true

      - name: Pull latest
        run: git pull origin main

      - name: Clear bytecode cache
        run: find pyFull/scripts -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true

      - name: Install dependencies
        run: pip install -r pyFull/requirements.txt

      - name: Run daily
        working-directory: pyFull/scripts
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python run_daily.py

      - name: Upload pyFull data
        uses: actions/upload-artifact@v7
        with:
          name: pyFull-data
          path: pyFull/data

  nba-props:
    runs-on: self-hosted
    needs: nba
    defaults:
      run:
        shell: bash
    steps:
      - name: Clean up stale rebase
        run: git rebase --abort 2>/dev/null || true

      - uses: actions/checkout@v6
        with:
          ref: main
          clean: true

      - name: Pull latest
        run: git pull origin main

      - name: Clear bytecode cache
        run: find pyNBAPROPS -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true

      - name: Install dependencies
        run: pip install -r pyNBAPROPS/requirements.txt

      - name: Run daily NBA props
        working-directory: pyNBAPROPS
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: python -m scripts.run_daily

      - name: Upload pyNBAPROPS data
        uses: actions/upload-artifact@v7
        with:
          name: pyNBAPROPS-data
          path: pyNBAPROPS/data

      - name: Upload shared props cache
        uses: actions/upload-artifact@v7
        with:
          name: shared-props-cache
          path: data/props_cache/nba

  commit-and-push:
    runs-on: ubuntu-latest
    needs: [nba, nba-fullseason, nba-props]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: pyNBA-data
          path: artifacts/pyNBA

      - uses: actions/download-artifact@v8
        with:
          name: pyFull-data
          path: artifacts/pyFull

      - uses: actions/download-artifact@v8
        with:
          name: pyNBAPROPS-data
          path: artifacts/pyNBAPROPS

      - uses: actions/download-artifact@v8
        with:
          name: shared-injury-cache
          path: artifacts/injury-cache

      - uses: actions/download-artifact@v8
        with:
          name: shared-odds-cache
          path: artifacts/odds-cache

      - uses: actions/download-artifact@v8
        with:
          name: shared-stats-cache
          path: artifacts/stats-cache

      - uses: actions/download-artifact@v8
        with:
          name: shared-espn-cache
          path: artifacts/espn-cache

      - uses: actions/download-artifact@v8
        with:
          name: shared-props-cache
          path: artifacts/props-cache

      - name: Copy artifacts
        shell: bash
        run: |
          cp -a artifacts/pyNBA/. pyNBA/data/
          cp -a artifacts/pyFull/. pyFull/data/
          cp -a artifacts/pyNBAPROPS/. pyNBAPROPS/data/
          mkdir -p data/injury_cache/nba
          cp -a artifacts/injury-cache/. data/injury_cache/nba/
          mkdir -p data/odds_cache/nba
          cp -a artifacts/odds-cache/. data/odds_cache/nba/
          mkdir -p data/stats_cache/nba
          cp -a artifacts/stats-cache/. data/stats_cache/nba/
          mkdir -p data/espn_cache/nba
          cp -a artifacts/espn-cache/. data/espn_cache/nba/
          mkdir -p data/props_cache/nba
          cp -a artifacts/props-cache/. data/props_cache/nba/
          cp pyNBA/data/history.json PythonDashboard/data/nba.json
          cp pyFull/data/history.json PythonDashboard/data/fullseason.json
          cp -f artifacts/pyNBAPROPS/nba-props.json PythonDashboard/data/nba-props.json 2>/dev/null || true

      - name: Commit & push data changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyNBA/data/ pyFull/data/ pyNBAPROPS/data/ data/injury_cache/nba/ data/odds_cache/nba/ data/stats_cache/nba/ data/espn_cache/nba/ data/props_cache/nba/ PythonDashboard/data/nba.json PythonDashboard/data/fullseason.json PythonDashboard/data/nba-props.json
          git diff --cached --quiet || git commit -m "Run daily Python NBA + Fullseason + NBA Props"
          git pull --rebase origin main
          git push
