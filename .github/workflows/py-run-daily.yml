name: Python Run Daily (Fullseason + NBA Props)

on:
  workflow_dispatch:
  schedule:
    # 2026-27 season (activated 2026-10-19). Two runs a day: a morning pass
    # once lineups/injury reports are out, and a late-afternoon pass before
    # the first tip (earliest NBA tips are ~6:00 PM CT). GitHub cron is UTC and
    # only fires on the default branch. :45 keeps us off the congested :00/:30
    # marks (those get delayed/dropped first).
    #   16:45 UTC = 11:45 AM CDT / 10:45 AM CST
    #   22:45 UTC =  5:45 PM CDT /  4:45 PM CST
    # A midday pass refreshes lines/injuries between the two (weekend slates
    # tip as early as ~12:00-2:30 PM CT, and weekday injury reports move):
    #   19:15 UTC =  2:15 PM CDT /  1:15 PM CST
    # The local Windows Task Scheduler jobs "Python NBA+Full Run Daily" (6 PM)
    # and "Python NBA+Full Run Daily 11AM", which dispatched this workflow via
    # scripts/trigger-py-nba-picks.bat, must stay DISABLED so the two schedules
    # never double-trigger (the 6 PM one needs an elevated shell:
    #   Disable-ScheduledTask -TaskName "Python NBA+Full Run Daily").
    # To go back to local dispatch, drop this schedule block and run:
    #   Enable-ScheduledTask -TaskName "Python NBA+Full Run Daily"
    #   Enable-ScheduledTask -TaskName "Python NBA+Full Run Daily 11AM"
    - cron: '45 16 * * *'
    - cron: '15 19 * * *'
    - cron: '45 22 * * *'


permissions:
  contents: write

# Serialize runs: a second dispatch queues behind any in-progress run instead
# of executing in parallel. Prevents two runs writing the same data files and
# conflicting on push.
concurrency:
  group: py-run-daily
  cancel-in-progress: false

jobs:
  nba-fullseason:
    # Self-hosted runner (same as the WNBA/MLB dailies): stats.nba.com refuses
    # GitHub-hosted IPs (RemoteDisconnected/timeout from windows-latest), and
    # both pyFull and pyNBAPROPS fetch from it. The 2026-07-23 switch to
    # windows-latest happened in the offseason and was never exercised
    # in-season. Moved back 2026-10-19.
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: Clean up stale rebase
        run: $ErrorActionPreference='SilentlyContinue'; git rebase --abort 2>&1 | Out-Null; exit 0

      - uses: actions/checkout@v6
        with:
          ref: main
          clean: true

      - name: Pull latest
        run: |
          git config --global --add safe.directory '*'
          git pull origin main

      - name: Clear bytecode cache
        run: Get-ChildItem -Path pyFull/scripts -Filter __pycache__ -Recurse -Directory -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force

      - name: Install dependencies
        run: pip install -r pyFull/requirements.txt

      - name: Run daily
        working-directory: pyFull/scripts
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python run_daily.py

      - name: Copy dashboard data
        run: |
          Copy-Item pyFull/data/history.json PythonDashboard/data/fullseason.json -Force
          Copy-Item pyFull/data/nba-systems.json PythonDashboard/data/nba-systems.json -Force -ErrorAction SilentlyContinue
          # Archived seasons (season rollover moves last season out of history.json)
          # so the dashboard's season dropdown can still show them.
          New-Item -ItemType Directory -Force PythonDashboard/data/archive | Out-Null
          $seasons = @()
          Get-ChildItem pyFull/data/archive -Filter 'history-*.json' | Where-Object { $_.Name -notlike '*superseded*' } | ForEach-Object {
            $s = $_.BaseName -replace '^history-', ''
            Copy-Item $_.FullName "PythonDashboard/data/archive/fullseason-$s.json" -Force
            $seasons += $s
          }
          ConvertTo-Json -Compress @{ seasons = @($seasons) } | Set-Content PythonDashboard/data/archive/fullseason-seasons.json

      - name: Commit & push Fullseason data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Scope to pyFull-owned paths so a parallel pyNBAPROPS push can't race us.
          git add pyFull/data/ PythonDashboard/data/fullseason.json PythonDashboard/data/nba-systems.json PythonDashboard/data/archive/ data/odds_cache/nba/ data/stats_cache/nba/ data/injury_cache/nba/ data/espn_cache/nba/
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "Run daily Python Fullseason [skip ci]"
          $tries = 0
          while ($tries -lt 5) {
            git pull --rebase --autostash origin main
            git push
            if ($LASTEXITCODE -eq 0) { exit 0 }
            $tries++
            Start-Sleep -Seconds 5
          }
          exit 1

  nba-props:
    needs: nba-fullseason
    # Self-hosted for the same stats.nba.com reason as nba-fullseason.
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: Clean up stale rebase
        run: $ErrorActionPreference='SilentlyContinue'; git rebase --abort 2>&1 | Out-Null; exit 0

      - uses: actions/checkout@v6
        with:
          ref: main
          clean: true

      - name: Pull latest
        run: |
          git config --global --add safe.directory '*'
          git pull origin main

      - name: Clear bytecode cache
        run: Get-ChildItem -Path pyNBAPROPS -Filter __pycache__ -Recurse -Directory -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force

      - name: Install dependencies
        run: pip install -r pyNBAPROPS/requirements.txt

      - name: Run daily NBA props
        working-directory: pyNBAPROPS
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python -m scripts.run_daily

      - name: Copy dashboard data
        run: Copy-Item pyNBAPROPS/data/nba-props.json PythonDashboard/data/nba-props.json -Force -ErrorAction SilentlyContinue

      - name: Commit & push NBA Props data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Scope to pyNBAPROPS-owned paths so a parallel pyFull push can't race us.
          git add pyNBAPROPS/data/ PythonDashboard/data/nba-props.json data/player_cache/nba/ data/props_cache/nba/ data/injury_cache/nba/ data/espn_cache/nba/
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "Run daily Python NBA Props [skip ci]"
          $tries = 0
          while ($tries -lt 5) {
            git pull --rebase --autostash origin main
            git push
            if ($LASTEXITCODE -eq 0) { exit 0 }
            $tries++
            Start-Sleep -Seconds 5
          }
          exit 1
