name: MLB Run Daily (8/11/1:30/4/6/7:30 CT)

on:
  # Manual trigger only. The MLB pipeline is scheduled by the local Windows
  # Task Scheduler job "MLB Run Daily", which dispatches this workflow 6x/day
  # (8:00/11:00/1:30/4:00/6:00/7:30 CT). A native GitHub cron here would
  # double-trigger against that local task, so it is intentionally omitted.
  workflow_dispatch:

permissions:
  contents: write

# Serialize runs: a second dispatch queues behind any in-progress run instead
# of executing in parallel. Prevents two runs writing the same data files and
# conflicting on push.
# 2026-08-27: group renamed mlb-run-daily -> mlb-run-daily-v2. Run #1506
# (dispatched 2026-08-26T15:16:12Z) is permanently stranded in the OLD group:
# GitHub reports it "queued" but never assigned it a job, and it cannot be
# cancelled (409 "has not been queued yet"), force-cancelled (409), rerun
# (403 "already running") or deleted (403). It sat harmlessly for a day, then
# after the workflow was toggled disabled/enabled it began holding the group
# and blocked #1515 (0 jobs assigned -- gated, not waiting on the runner).
# A fresh group name is the only way past it; serialization is unchanged.
concurrency:
  group: mlb-run-daily-v2
  cancel-in-progress: false

jobs:
  mlb-props:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: Clean up stale rebase
        run: $ErrorActionPreference='SilentlyContinue'; git rebase --abort 2>&1 | Out-Null; exit 0

      - uses: actions/checkout@v6
        with:
          ref: main
          clean: true

      - name: Pull latest
        run: |
          git config --global --add safe.directory '*'
          git pull origin main

      - name: Clear bytecode cache
        run: Get-ChildItem -Path MLBstrikeouts -Filter __pycache__ -Recurse -Directory -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force

      # These stat caches are written with "never expire" (_load_cache with no
      # max_age_hours), so deleting them here IS the TTL -- without this step
      # the 11:00 run would reuse the 8:00 snapshot all day. Added 2026-04-14
      # (9ee620209) to stop stale caches crashing the run.
      #
      # EXCEPT *_thru_*: those are keyed by date-RANGE END, not by fetch date,
      # so "season through 2026-05-19" is immutable and cannot go stale --
      # fetch_pitcher_advanced_stats_through says "historical days never need
      # to refetch". They landed 2026-05-19 (89d63880e), five weeks after this
      # step, and silently inherited its pitcher_advanced_* / team_batting_*
      # globs, so every run deleted ~333 files it had no reason to. Nothing was
      # ever wrong (the daily run regenerates what it reads, and a refetch is
      # byte-identical) -- it just cost a manual backfill ~170 needless
      # date-range refetches. 2026-09-12: excluded, and the 333 restored.
      - name: Clear stale pitcher caches
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          Get-ChildItem -Path "data\pitcher_cache\mlb" -Filter "*.json" |
            Where-Object {
              $_.Name -match '^(team_pitching|team_batting|pitcher_advanced|pitcher_sabermetrics)_' -and
              $_.Name -notmatch '_thru_'
            } | Remove-Item -Force
          exit 0

      - name: Install dependencies
        run: pip install -r MLBstrikeouts/requirements.txt

      - name: Run daily MLB props
        working-directory: MLBstrikeouts
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m scripts.run_daily

      # Whiff .1/Cap26 variant ("MLB K's Whiff .1/Cap26"): same pipeline,
      # identical config to the live model except CSW_XBA_BLEND_WEIGHT 0.1
      # (vs live 0.2) and BF_CAP 26 (vs live 25). Selected via MLB_K_VARIANT.
      # Runs AFTER the live run on the same runner so the shared raw-data
      # caches are already warm. Writes only *_w01c26 outputs
      # (mlb-props_w01c26.json, kalman_state_w01c26.json,
      # emp_std_cache/mlb_w01c26) — the live files are untouched.
      - name: Run daily MLB props (Whiff .1/Cap26 variant)
        working-directory: MLBstrikeouts
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          MLB_K_VARIANT: w01c26
        run: python -m scripts.run_daily

      # Fade-list moneyline model ("MLB Fade ML"): when a fade-list pitcher
      # starts, bet the opponent's FanDuel moneyline. Grades prior bets from
      # the frozen ML cache + game results, then writes today's picks. Live
      # odds come from FanDuel's own API (Odds API fallback). Runs AFTER the K
      # steps; writes only mlb-fade-ml.json + data/odds_cache/mlb_ml.
      - name: Run daily MLB fade ML
        working-directory: MLBstrikeouts
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m scripts.run_daily_ml

      # ALL-ML dataset ("MLB ALL ML" tab): every settled game this season plus
      # today's slate, with the cached FanDuel odds + pitcher handedness. Reads
      # the odds cache only (no Odds API spend; one free MLB roster call for
      # handedness). Runs AFTER the fade step so today's odds are cached. Writes
      # mlb-all-ml.json to both data locations. Non-blocking: a failure here
      # must not abort the core daily props/fade pipeline.
      - name: Build MLB ALL-ML dataset
        continue-on-error: true
        working-directory: MLBstrikeouts
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: python -m scripts.build_all_ml

      # Walk-forward hand-tails ROSTER: recomputes each arm's active [add, remove)
      # windows from the settled ALL-ML games (re-graded on posted PRE-GAME
      # lineups). An arm is a fade only from the day its platoon-disadvantage
      # record first cleared 4 starts & +3.0u, forward-only, and drops off if it
      # slips back below. Reads mlb-all-ml.json (built above), so runs AFTER it
      # and BEFORE the grader that consumes the roster. Because it only sees
      # settled games (through yesterday), an arm crossing the bar on today's
      # start isn't added until tomorrow's rebuild -- the "add next day" rule.
      - name: Build MLB hand-tails roster
        continue-on-error: true
        working-directory: MLBstrikeouts
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: python -m scripts.build_hand_tails_roster

      # Handedness-tails tracker ("MLB Hand Tails"): walk-forward conditional fade
      # on arms facing 6+ opposite-hand lineups, gated to each arm's active roster
      # windows (built above). Reads today's lineup handedness from the K-model
      # caches (run_daily above populated them) + the cached FanDuel ML. Own
      # ledger (mlb-hand-tails.json); does not touch the fade list. Non-blocking.
      - name: Run daily MLB hand-tails
        continue-on-error: true
        working-directory: MLBstrikeouts
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: python -m scripts.run_daily_hand_tails

      # Shadow watchlist for the handedness fade/tail idea: arms NOT on the
      # active hand-tails list showing a platoon-disadvantage edge. Review-only
      # (nothing bet). Reads the ALL-ML dataset built above, so runs after it.
      - name: Build MLB hand-tails watchlist
        continue-on-error: true
        working-directory: MLBstrikeouts
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: python -m scripts.hand_tails_watch

      # Fade watchlist: arms NOT on the active fade list whose home or away fade
      # clears the bar (>= min games & +min units). Review-only. Reads the
      # ALL-ML dataset, so runs after it.
      - name: Build MLB fade watchlist
        continue-on-error: true
        working-directory: MLBstrikeouts
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: python -m scripts.fade_watch

      # Pitcher-vs-team FADE list (curated + auto ERA>=8 matchups). Reads the
      # ALL-ML dataset + season game logs, so runs after build_all_ml.
      - name: Build MLB fade-vs-team list
        continue-on-error: true
        working-directory: MLBstrikeouts
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: python -m scripts.fade_vs_team

      # Pitcher-vs-team WATCH list (ERA 6-8 vs the team). Review-only.
      - name: Build MLB fade-vs-team watchlist
        continue-on-error: true
        working-directory: MLBstrikeouts
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: python -m scripts.fade_vs_team_watch

      # TRUE all-pitcher PA-level splits source: ingests play-by-play and tallies
      # each plate appearance under the ACTUAL pitcher's hand (starters AND
      # relievers), split by the batting team's home/away side. Incremental --
      # only fetches games not already in the cache, so the daily run just adds
      # today's slate. Feeds build_team_woba_splits below.
      - name: Ingest MLB play-by-play PA splits
        continue-on-error: true
        working-directory: MLBstrikeouts
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: python -m scripts.build_pbp_team_pa

      # Self-computed team wOBA/wRC+ splits vs LHP/RHP by window (season, each
      # month, last-30/15) and home/away. Powers the Team wRC+ card's Window +
      # Venue selectors. Reads the TRUE all-pitcher PA splits (team_pa_splits_
      # 2026.json) from the step above.
      - name: Build MLB team wOBA/wRC+ splits
        continue-on-error: true
        working-directory: MLBstrikeouts
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: python -m scripts.build_team_woba_splits

      # Slate scouting view for the "MLB Slate Scout" dashboard tab: tonight's
      # starters with season / last-5 / last-3 form against the opposing
      # offense's wRC+ by hand, plus the data flags (opener, layoff, stale
      # window) that say when those rates cannot be read at face value.
      # Advisory only -- no pick, gate, size or grade reads it. Fails open.
      - name: Build MLB slate scout view
        continue-on-error: true
        working-directory: MLBstrikeouts
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: python -m scripts.build_slate_scout

      # The flag-combo performance grid the Slate Scout tab renders. Replays
      # role_flags as-of every game date of the season from the pitcher logs
      # and grades each combo both ways at the real prices. Rebuilt every run
      # so the dashboard never shows a number somebody remembered -- a
      # 15-slate window endorsed a rust-over rule on 2026-09-01 that the full
      # season killed the same day. Fails open.
      - name: Build MLB flag-combo table
        continue-on-error: true
        working-directory: MLBstrikeouts
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: python -m scripts.build_flag_combo_table

      # The better-arm ML rule's season record (m_sum >= +40 pool). Same
      # as-of replay, graded at each game's own moneyline, with the
      # back-the-favorite control that keeps it honest. Shadow status lives
      # in the script. Fails open.
      - name: Build MLB better-arm ML table
        continue-on-error: true
        working-directory: MLBstrikeouts
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: python -m scripts.build_msum_ml_table

      # The eight non-scout systems: season records replayed as-of every game
      # date from mlb-all-ml.json alone, plus tonight's qualifiers. Must run
      # BEFORE the logger, which reads the same module for today's plays.
      - name: Build MLB non-scout systems table
        continue-on-error: true
        working-directory: MLBstrikeouts
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: python -m scripts.build_allml_systems_table

      # Season history for the scout rules that had no grid: Form under,
      # Aligned ML, Mismatch ML. Their records used to live only as prose in
      # CLAUDE.md, so a carded rule could drift for weeks unseen.
      - name: Build MLB scout rules table
        continue-on-error: true
        working-directory: MLBstrikeouts
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: python -m scripts.build_scout_rules_table

      # Log every rule's qualifiers into the scout ledger -- card AND shadow.
      # Until 2026-09-01 this was hand-work in a session, so a day without a
      # session left silent holes and shadow periods never filled. Idempotent
      # by (date, rule, game, line/pick): six runs a day add each play once and
      # never rewrite a price. Entries carry "auto": true and record that the
      # RULE fired, not that a bet was placed -- mark one not_bet by hand when
      # a play was missed. Runs AFTER both tables so verdicts are current.
      # Publish the card/shadow status table both the logger and the
      # dashboard read, so they cannot drift apart. Must run BEFORE the
      # logger, which imports the same definitions.
      - name: Publish MLB rule status
        continue-on-error: true
        working-directory: MLBstrikeouts
        env:
          PYTHONUTF8: "1"
        run: python -m scripts.rule_status

      - name: Log MLB scout qualifiers
        continue-on-error: true
        working-directory: MLBstrikeouts
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: python -m scripts.log_daily_qualifiers

      # Settle yesterday's (and any older) pending entries from the finals in
      # mlb-all-ml.json. Grading was the last hand step -- the 8/30 card sat
      # open for two days -- and a ledger that logs itself but never grades
      # itself looks complete while every rule's W-L is stuck. Profit uses each
      # entry's OWN stored price, so a moved line cannot regrade a play.
      # Verified against all 131 hand-graded rows before going live.
      - name: Grade MLB scout ledger
        continue-on-error: true
        working-directory: MLBstrikeouts
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: python -m scripts.grade_scout_ledger

      # Publish the last two weeks of logged plays with their results, so the
      # tab's date selector can show how yesterday's card finished instead of
      # only ever showing tonight. Must run AFTER the grader, or the newest
      # day publishes as pending when it has just been settled.
      - name: Build MLB plays feed
        continue-on-error: true
        working-directory: MLBstrikeouts
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: python -m scripts.build_plays_feed

      # 2026-09-11: the six upload-artifact steps and the separate
      # `commit-and-push` job on ubuntu-latest were removed. They shipped
      # ~220 MB / 21k files (179 MB of it the pitcher cache) to the artifact
      # service every run so a second machine could download them, copy them
      # back into a fresh checkout and push -- ~200s of upload plus a ~67s job,
      # roughly four minutes per run, to move the ~100 files a run actually
      # changes. This runner already HAS the checkout and the workflow already
      # grants contents: write, so it commits and pushes directly. Nothing
      # outside this file consumed those artifacts; the committed data in git
      # is the durable record.

      # NOTE: every step in this job MUST use PowerShell (the job default).
      # "shell: bash" resolves to the system32 bash.EXE -- that is WSL, not Git
      # Bash -- and this runner's service account is LOCAL SYSTEM, which WSL
      # refuses outright ("Running WSL as local system is not supported",
      # WSL_E_LOCAL_SYSTEM_NOT_SUPPORTED). That is the real reason the copy and
      # push steps used to live on an ubuntu-latest job. Run 34663909552
      # (2026-09-12) failed exactly this way. The WNBA daily pushes from this
      # same runner in PowerShell; that is the pattern to copy.

      # Publish the dashboard's copies. EXPLICIT WHITELIST -- a new MLB
      # dashboard JSON must be added here or PythonDashboard silently keeps
      # serving the previous run's file.
      - name: Publish dashboard JSONs
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force PythonDashboard/data | Out-Null
          $names = @(
            'mlb-props', 'mlb-props_w01c26', 'mlb-fade-ml', 'mlb-hand-tails',
            'mlb-hand-tails-watch', 'mlb-all-ml', 'mlb-fade-watch', 'mlb-pitch-hands',
            'mlb-fade-vs-team', 'mlb-fade-vs-team-watch', 'mlb-team-woba-splits',
            'mlb-slate-scout', 'flag-combo-table', 'msum-ml-table', 'rule-status',
            'allml-systems-table', 'plays-feed', 'scout-rules-table',
            'hand-tails-roster'
          )
          foreach ($n in $names) {
            Copy-Item "MLBstrikeouts/data/$n.json" "PythonDashboard/data/$n.json" -Force
          }
          exit 0

      - name: Commit & push data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The scout ledger is written by BOTH this run (auto qualifiers) and
          # by sessions (grades, not_bet marks, notes). Take main's version
          # FIRST and re-run the logger against it -- that keeps session edits
          # and re-adds today's qualifiers idempotently, instead of a blanket
          # revert which would throw away this run's own rows.
          git fetch origin main
          git checkout FETCH_HEAD -- MLBstrikeouts/data/scout-card-log.json
          Push-Location MLBstrikeouts
          python -m scripts.log_daily_qualifiers
          python -m scripts.grade_scout_ledger
          python -m scripts.build_plays_feed
          Pop-Location
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "Run daily MLB Pitcher Props (Whiff .2 + .1/Cap26) + Game Hits [skip ci]"
          # Retry like the WNBA daily does: this runner races the other daily
          # pipelines for main, and a lost race would otherwise fail the run.
          $tries = 0
          while ($tries -lt 5) {
            git pull --rebase --autostash origin main
            git push
            if ($LASTEXITCODE -eq 0) { exit 0 }
            $tries++
            Start-Sleep -Seconds 5
          }
          exit 1
