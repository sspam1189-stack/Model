name: Run NBA Combined

on:
  workflow_dispatch:


permissions:
  contents: write

jobs:
  nba:
    runs-on: self-hosted
    steps:
      - name: Clean up stale rebase
        run: git rebase --abort 2>/dev/null || true
        shell: bash

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: npm ci && npm ci --prefix ../core-js
        working-directory: jsNBA

      - name: Run daily
        working-directory: jsNBA
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: node scripts/run_daily.mjs

      - name: Upload jsNBA data
        uses: actions/upload-artifact@v7
        with:
          name: jsNBA-data
          path: jsNBA/data

  nba-fullseason:
    runs-on: self-hosted
    needs: nba
    steps:
      - name: Clean up stale rebase
        run: git rebase --abort 2>/dev/null || true
        shell: bash

      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Pull latest
        run: git pull origin main

      - name: Install dependencies
        shell: bash
        run: npm ci && npm ci --prefix ../core-js
        working-directory: jsFull

      - name: Run daily
        working-directory: jsFull
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: node scripts/run_daily.mjs

      - name: Upload jsFull data
        uses: actions/upload-artifact@v7
        with:
          name: jsFull-data
          path: jsFull/data

  py-nba:
    runs-on: self-hosted
    needs: nba-fullseason
    defaults:
      run:
        shell: bash
    steps:
      - name: Clean up stale rebase
        run: git rebase --abort 2>/dev/null || true

      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Pull latest
        run: git pull origin main

      - name: Download jsNBA cache
        uses: actions/download-artifact@v8
        with:
          name: jsNBA-data
          path: jsNBA/data

      - name: Install dependencies
        run: pip install -r pyNBA/requirements.txt

      - name: Run daily
        working-directory: pyNBA/scripts
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python run_daily.py

      - name: Upload pyNBA data
        uses: actions/upload-artifact@v7
        with:
          name: pyNBA-data
          path: pyNBA/data

  py-fullseason:
    runs-on: self-hosted
    needs: py-nba
    defaults:
      run:
        shell: bash
    steps:
      - name: Clean up stale rebase
        run: git rebase --abort 2>/dev/null || true

      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Pull latest
        run: git pull origin main

      - name: Download jsFull cache
        uses: actions/download-artifact@v8
        with:
          name: jsFull-data
          path: jsFull/data

      - name: Install dependencies
        run: pip install -r pyFull/requirements.txt

      - name: Run daily
        working-directory: pyFull/scripts
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python run_daily.py

      - name: Upload pyFull data
        uses: actions/upload-artifact@v7
        with:
          name: pyFull-data
          path: pyFull/data

  commit-and-push:
    runs-on: ubuntu-latest
    needs: [nba, nba-fullseason, py-nba, py-fullseason]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: jsNBA-data
          path: artifacts/jsNBA

      - uses: actions/download-artifact@v8
        with:
          name: jsFull-data
          path: artifacts/jsFull

      - uses: actions/download-artifact@v8
        with:
          name: pyNBA-data
          path: artifacts/pyNBA

      - uses: actions/download-artifact@v8
        with:
          name: pyFull-data
          path: artifacts/pyFull

      - name: Copy artifacts
        shell: bash
        run: |
          cp -a artifacts/jsNBA/. jsNBA/data/
          cp -a artifacts/jsFull/. jsFull/data/
          cp -a artifacts/pyNBA/. pyNBA/data/
          cp -a artifacts/pyFull/. pyFull/data/

      - name: Commit & push data changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jsNBA/data/ jsFull/data/ pyNBA/data/ pyFull/data/
          git diff --cached --quiet || git commit -m "Run daily NBA combined"
          git pull --rebase origin main
          git push
